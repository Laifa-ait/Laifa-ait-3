name: Olmart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-typecheck-test-build:
    name: "Lint, Typecheck, Test & Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (required for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js (v22.23.2)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (Production Dependencies - High+)
        run: npm run audit:ci

      - name: ESLint Code Quality
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Core Security & Unit Test Suite
        run: ALLOW_TESTS_WITHOUT_EMULATOR=true npx vitest run src/tests/format.test.ts src/tests/sanitization.test.ts src/tests/validation.test.ts src/tests/validateIdParam.test.ts

      - name: Upload Test Coverage Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Validate Image Assets
        run: npm run validate:assets

      - name: Build Application (SPA + Server)
        run: npm run build

      - name: Upload Build Artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          if-no-files-found: ignore

  docker-build-verification:
    name: "Docker Build Verification"
    needs: [lint-typecheck-test-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Verify Dockerfile Build Integrity)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: olmart-web:test-build

  firestore-concurrency-emulator:
    name: "Firestore ACID Stock Concurrency (Emulator)"
    needs: [lint-typecheck-test-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (required for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js (v22.23.2)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Real Firestore Concurrency Test in Emulator
        run: npm run test:emulator:concurrency

  e2e-tests:
    name: "Playwright E2E & Critical Journey Verification"
    needs: [lint-typecheck-test-build]
    runs-on: ubuntu-latest
    environment: staging-e2e
    env:
      # e2e/critical.spec.ts mocks Firebase requests, so no real Firebase credential is needed.
      VITE_FIREBASE_API_KEY: E2E_NO_REAL_API_KEY
      VITE_FIREBASE_APP_ID: E2E_NO_REAL_APP_ID
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'olmart-staging-e2e.firebaseapp.com' }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'olmart-staging-e2e' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'olmart-staging-e2e.firebasestorage.app' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '207154734313' }}
      VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID || '(default)' }}
      FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'olmart-staging-e2e' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22.23.2)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Build Application (SPA + Server) for E2E
        run: npm run build

      - name: Execute Playwright E2E Test Suite
        run: npm run test:e2e

      - name: Upload Playwright Test Report Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  cloud-run-health-check:
    name: "Post-Deployment Cloud Run Health Verification"
    needs: [lint-typecheck-test-build, docker-build-verification, firestore-concurrency-emulator, e2e-tests]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-latest
    environment: staging-e2e
    env:
      CLOUD_RUN_URL: ${{ vars.CLOUD_RUN_URL }}

    steps:
      - name: Wait for Cloud Build deployment and verify Cloud Run health
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUD_RUN_URL:-}" ]]; then
            echo "CLOUD_RUN_URL is not configured in the staging-e2e environment."
            exit 1
          fi

          target_url="${CLOUD_RUN_URL%/}"
          live_body="$(mktemp)"
          ready_body="$(mktemp)"
          trap 'rm -f "$live_body" "$ready_body"' EXIT

          for attempt in $(seq 1 20); do
            live_code="$(curl -sS -o "$live_body" -w '%{http_code}' --max-time 10 "${target_url}/api/v1/health/live" || true)"
            ready_code="$(curl -sS -o "$ready_body" -w '%{http_code}' --max-time 15 "${target_url}/api/v1/health/ready" || true)"

            echo "Attempt ${attempt}/20 — live: ${live_code:-000}, ready: ${ready_code:-000}"
            if [[ "${live_code}" == "200" && "${ready_code}" == "200" ]] &&
              jq -e '.status == "alive"' "$live_body" >/dev/null &&
              jq -e '.status == "ready" and .firebase == "ok" and .frontend == "ok"' "$ready_body" >/dev/null; then
              cat "$live_body"
              cat "$ready_body"
              echo "Cloud Run service is ready at ${target_url}"
              exit 0
            fi

            if [[ "${attempt}" -lt 20 ]]; then
              sleep 15
            fi
          done

          echo "Cloud Run did not become ready within five minutes at ${target_url}."
          echo "Liveness response:"
          cat "$live_body" || true
          echo
          echo "Readiness response:"
          cat "$ready_body" || true
          exit 1
