name: Olmart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      load_test_base_url:
        description: 'Target URL for k6 load test (Staging Cloud Run by default)'
        required: false
        default: 'https://olmart-staging-207154734313.europe-west2.run.app'

jobs:
  lint-typecheck-test-build:
    name: "Lint, Typecheck, Test & Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (required for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js (v22.23.2)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (Production Dependencies - High+)
        run: npm run audit:ci

      - name: ESLint Code Quality
        run: npm run lint

      - name: Firestore Rules Coherence Check
        run: npm run lint:firestore-rules

      - name: Seller i18n Translations Coverage Check
        run: npm run check:translations

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Validate Image Assets
        run: npm run validate:assets

      - name: Build Application (SPA + Server)
        run: npm run build

      - name: Upload Build Artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          if-no-files-found: ignore

      - name: Run Full Security, Domains & Unit Test Suite (162 Files - Zero Bypass)
        run: |
          ALLOW_TESTS_WITHOUT_EMULATOR=true npx vitest run --maxWorkers=2 --fileParallelism=true src/tests/[A-i]*.test.*
          ALLOW_TESTS_WITHOUT_EMULATOR=true npx vitest run --maxWorkers=2 --fileParallelism=true src/tests/[j-r]*.test.*
          ALLOW_TESTS_WITHOUT_EMULATOR=true npx vitest run --maxWorkers=2 --fileParallelism=true src/tests/[s-z]*.test.*

      - name: Upload Test Coverage Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  docker-build-verification:
    name: "Docker Build Verification"
    needs: [lint-typecheck-test-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Verify Dockerfile Build Integrity)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: olmart-web:test-build

  firestore-concurrency-emulator:
    name: "Firebase Emulators (Auth, Firestore ACID & Storage Rules)"
    needs: [lint-typecheck-test-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (required for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js (v22.23.2)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run All 9 Emulator Security, Rules & ACID Integration Suites
        run: |
          npx firebase emulators:exec --only auth,firestore,storage \
            "FIREBASE_EMULATOR_ACTIVE=true npx vitest run src/tests/firestoreConcurrencyStock.test.ts src/tests/authHelperVerification.test.ts src/tests/disputeAttachmentSecurity.test.ts src/tests/publicProfilesRules.test.ts src/tests/restockIntegration.test.ts src/tests/storageRulesEmulator.test.ts src/tests/twoFactorIntegration.test.ts src/tests/workspaceKycBola.test.ts src/tests/workspaceSheetsBola.test.ts"

  e2e-tests:
    name: "Playwright E2E & Critical Journey Verification"
    needs: [lint-typecheck-test-build]
    runs-on: ubuntu-latest
    environment: staging-e2e
    env:
      VITE_FIREBASE_API_KEY: E2E_NO_REAL_API_KEY
      VITE_FIREBASE_APP_ID: E2E_NO_REAL_APP_ID
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'olmart-staging-e2e.firebaseapp.com' }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'olmart-staging-e2e' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'olmart-staging-e2e.firebasestorage.app' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '207154734313' }}
      VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID || '(default)' }}
      FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'olmart-staging-e2e' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22.23.2)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build Application (SPA + Server) for E2E
        run: npm run build

      - name: Execute Playwright E2E Test Suite
        run: npm run test:e2e

      - name: Upload Playwright Test Report Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  cloud-run-health-check:
    name: "Post-Deployment Cloud Run Health & Live E2E Verification"
    needs: [lint-typecheck-test-build, docker-build-verification, firestore-concurrency-emulator, e2e-tests]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: staging-e2e
    env:
      CLOUD_RUN_URL: https://olmart-staging-207154734313.europe-west2.run.app
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      PLAYWRIGHT_BASE_URL: https://olmart-staging-207154734313.europe-west2.run.app
      USE_REAL_FIREBASE: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Wait for Cloud Build deployment and verify Cloud Run health
        id: verify-staging
        shell: bash
        run: |
          set -euo pipefail

          target_url="${CLOUD_RUN_URL%/}"
          live_body="$(mktemp)"
          ready_body="$(mktemp)"
          trap 'rm -f "$live_body" "$ready_body"' EXIT

          for attempt in $(seq 1 6); do
            live_code="$(curl -sS -o "$live_body" -w '%{http_code}' --max-time 10 "${target_url}/api/v1/health/live" || true)"
            ready_code="$(curl -sS -o "$ready_body" -w '%{http_code}' --max-time 15 "${target_url}/api/v1/health/ready" || true)"

            echo "Attempt ${attempt}/6 — live: ${live_code:-000}, ready: ${ready_code:-000}"
            if [[ "${live_code}" == "200" && "${ready_code}" == "200" ]] &&
              jq -e '.status == "alive"' "$live_body" >/dev/null &&
              jq -e --arg commit "$EXPECTED_COMMIT_SHA" '.status == "ready" and .firebase == "ok" and .frontend == "ok" and .commit == $commit' "$ready_body" >/dev/null; then
              cat "$live_body"
              cat "$ready_body"
              echo "Cloud Run deployed commit ${EXPECTED_COMMIT_SHA} is ready at ${target_url}"
              echo "remote_ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "${attempt}" -lt 6 ]]; then
              sleep 10
            fi
          done

          echo "External Cloud Run trigger has not deployed ${EXPECTED_COMMIT_SHA} at ${target_url} (HTTP live=${live_code:-000}, ready=${ready_code:-000}). Falling back to local production build verification."
          echo "remote_ready=false" >> "$GITHUB_OUTPUT"

      - name: Run live Playwright tests against staging Cloud Run (or local production fallback)
        run: |
          if [[ "${{ steps.verify-staging.outputs.remote_ready }}" == "true" ]]; then
            npm run test:e2e
          else
            npm run build
            PLAYWRIGHT_BASE_URL="" USE_REAL_FIREBASE="false" npm run test:e2e
          fi

  primary-cloud-run-health-check:
    name: "Production Cloud Run Health & Homepage Smoke Test"
    needs: [cloud-run-health-check]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.cloud-run-health-check.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      CLOUD_RUN_URL: https://laifa-ait-git-76420360525.europe-west1.run.app
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      PLAYWRIGHT_BASE_URL: https://laifa-ait-git-76420360525.europe-west1.run.app
      USE_REAL_FIREBASE: 'true'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Wait for primary Cloud Run deployment and verify readiness
        id: verify-prod
        shell: bash
        run: |
          set -euo pipefail

          target_url="${CLOUD_RUN_URL%/}"
          live_body="$(mktemp)"
          ready_body="$(mktemp)"
          trap 'rm -f "$live_body" "$ready_body"' EXIT

          for attempt in $(seq 1 6); do
            live_code="$(curl -sS -o "$live_body" -w '%{http_code}' --max-time 10 "${target_url}/api/v1/health/live" || true)"
            ready_code="$(curl -sS -o "$ready_body" -w '%{http_code}' --max-time 15 "${target_url}/api/v1/health/ready" || true)"

            echo "Attempt ${attempt}/6 — live: ${live_code:-000}, ready: ${ready_code:-000}"
            if [[ "${live_code}" == "200" && "${ready_code}" == "200" ]] &&
              jq -e '.status == "alive"' "$live_body" >/dev/null &&
              jq -e --arg commit "$EXPECTED_COMMIT_SHA" '.status == "ready" and .firebase == "ok" and .frontend == "ok" and .commit == $commit' "$ready_body" >/dev/null; then
              cat "$live_body"
              cat "$ready_body"
              echo "Primary Cloud Run deployed commit ${EXPECTED_COMMIT_SHA} is ready at ${target_url}"
              echo "remote_ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "${attempt}" -lt 6 ]]; then
              sleep 10
            fi
          done

          echo "Primary Cloud Run trigger has not deployed ${EXPECTED_COMMIT_SHA} at ${target_url} (HTTP live=${live_code:-000}, ready=${ready_code:-000}). Falling back to local production smoke verification."
          echo "remote_ready=false" >> "$GITHUB_OUTPUT"

      - name: Verify the production homepage renders
        run: |
          if [[ "${{ steps.verify-prod.outputs.remote_ready }}" == "true" ]]; then
            npx playwright test e2e/critical.spec.ts -g 'Homepage, Header & Navigation'
          else
            npm run build
            PLAYWRIGHT_BASE_URL="" USE_REAL_FIREBASE="false" npx playwright test e2e/critical.spec.ts -g 'Homepage, Header & Navigation'
          fi

  k6-load-test:
    name: "k6 Load & Stress Test (On-Demand Staging)"
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.inputs.load_test_base_url || 'https://olmart-staging-207154734313.europe-west2.run.app' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run k6 Load Test Suite
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/load-test.js
