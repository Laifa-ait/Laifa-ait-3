name: Olmart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-typecheck-test-build:
    name: "Lint, Typecheck, Test & Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (required for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js (v22.23.2)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (Production Dependencies - High+)
        run: npm run audit:ci

      - name: ESLint Code Quality
        run: npm run lint

      - name: TypeScript Typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run typecheck

      - name: Run Vitest Test Suite with Coverage
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run test

      - name: Upload Test Coverage Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Validate Image Assets
        run: npm run validate:assets

      - name: Build Application (SPA + Server)
        run: npm run build

      - name: Upload Build Artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          if-no-files-found: ignore

  docker-build-verification:
    name: "Docker Build Verification"
    needs: [lint-typecheck-test-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Verify Dockerfile Build Integrity)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: olmart-web:test-build

  firestore-concurrency-emulator:
    name: "Firestore ACID Stock Concurrency (Emulator)"
    needs: [lint-typecheck-test-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (required for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js (v22.23.2)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Real Firestore Concurrency Test in Emulator
        run: npm run test:emulator:concurrency

